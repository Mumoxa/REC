title_modifiers:
  high_value:
    - Group
    - Regional
    - Country
    - Africa
    - Southern Africa
    - Enterprise
    - Global
    - Divisional
    - Business Unit
    - Corporate
    - Executive
    - Strategic
    - Principal
    - Lead
    - Senior
    - Chief
    - Head
    - Director
    - Board
    - Fractional
    - Interim
    - Portfolio

search_doctrine:
  always_include_exact_title_searches:
    - Executive Director
    - Non-Executive Director
    - Independent Non-Executive Director
    - Board Director
    - Board Member
    - Board Chair
    - Fractional CFO
    - Fractional CTO
    - Fractional CIO
    - Fractional COO
    - Fractional CMO
    - Fractional CHRO
    - Fractional Director
    - Fractional Executive
    - Principal Consultant
    - Senior Consultant
    - Managing Consultant
    - Specialist
    - Senior Specialist
    - Principal Specialist
  combine_with_role_taxonomy: true
  combine_with_location_taxonomy: true
  title_only_is_not_enough: true
  assess_context:
    - reporting_scope
    - decision_authority
    - budget_scope
    - enterprise_scope
    - scarcity
    - technical_depth
    - remuneration
    - client_or_board_accountability
    - advisory_scope
    - people_management
  do_not_require_people_management: true
  do_not_treat_part_time_as_low_seniority: true
