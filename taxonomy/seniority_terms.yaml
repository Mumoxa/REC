    notes:
      - Consultant and consulting titles are explicitly searchable and classifiable.
      - Consulting seniority must be interpreted using firm-specific ladders rather than only corporate manager titles.
      - ERP consulting and Cybersecurity consulting remain excluded under the role taxonomy where applicable.

  TIER_7_EXPERIENCED_PROFESSIONAL:
