version: 1.0.0
authority: user_supplied
scope: Talent Tree South Africa recruitment intelligence
purpose:
  - search_expansion
  - vacancy_classification
  - commercial_priority
  - market_mapping
  - candidate_sourcing

core_rule: >
  Seniority is not defined only by people-management. Scarcity, remuneration, technical depth,
  advisory scope, board accountability, enterprise impact and decision authority can place an
  individual contributor, consultant, specialist, fractional executive or board role above a
  conventional manager.

linkedin_application:
  search_expansion_only: true
  exclusion_use: false
  note: >
    The LinkedIn hidden-hiring engine remains role-agnostic during discovery. These seniority
    terms are positive discovery/search-expansion terms only and must never be used to suppress
    otherwise valid South African hiring signals.

priority_bands:

  TIER_0_BOARD_AND_ENTERPRISE:
    label: Board / enterprise governance / executive-director level
    search_priority: highest
    terms:
      - Board Chair
      - Board Chairperson
      - Chairperson
      - Chairman
      - Chairwoman
      - Board Director
      - Board Member
      - Executive Director
      - Non-Executive Director
      - Non Executive Director
      - NED
      - Independent Non-Executive Director
      - Independent Non Executive Director
      - INED
      - Advisory Board Member
      - Board Advisor
      - Board Adviser
      - Trustee
      - Board Trustee
      - Committee Chair
      - Audit Committee Chair
      - Risk Committee Chair
      - Remuneration Committee Chair
      - Social and Ethics Committee Chair
    mandatory_exact_searches:
      - Executive Director
      - Non-Executive Director
      - Independent Non-Executive Director
      - Board Director
      - Board Member
      - Board Chair
    notes:
      - Executive Director must be searched as an exact senior title and not treated as a generic Director synonym.
      - Board roles may be permanent, portfolio, advisory, statutory or non-executive.

  TIER_1_EXECUTIVE_LEADERSHIP:
    label: C-suite / executive / enterprise leadership
    search_priority: highest
    terms:
      - Chief Executive Officer
      - CEO
      - Chief Operating Officer
      - COO
      - Chief Financial Officer
      - CFO
      - Chief Information Officer
      - CIO
      - Chief Technology Officer
      - CTO
      - Chief Data Officer
      - CDO
      - Chief Digital Officer
      - Chief People Officer
      - CPO
      - Chief Human Resources Officer
      - CHRO
      - Chief Commercial Officer
      - Chief Marketing Officer
      - CMO
      - Chief Product Officer
      - Chief Strategy Officer
      - Chief Risk Officer
      - Chief Investment Officer
      - General Counsel
      - Company Secretary
      - Managing Director
      - MD
      - Managing Executive
      - Divisional Executive
      - Executive Manager
      - Executive Head
      - Executive
      - President
      - Vice President
      - VP
      - Senior Vice President
      - SVP
      - Executive Vice President
      - EVP
      - General Manager
      - GM

  TIER_1B_FRACTIONAL_INTERIM_PORTFOLIO:
    label: Fractional / interim / portfolio leadership
    search_priority: highest
    terms:
      - Fractional Executive
      - Fractional Director
      - Fractional CEO
      - Fractional COO
      - Fractional CFO
      - Fractional CIO
      - Fractional CTO
      - Fractional CDO
      - Fractional CMO
      - Fractional CHRO
      - Fractional CPO
      - Fractional Chief of Staff
      - Fractional General Counsel
      - Fractional Finance Director
      - Fractional HR Director
      - Fractional Marketing Director
      - Fractional Technology Director
      - Fractional Head
      - Fractional Head of
      - Interim Executive
      - Interim Director
      - Interim CEO
      - Interim COO
      - Interim CFO
      - Interim CIO
      - Interim CTO
      - Interim CMO
      - Interim CHRO
      - Interim Head of
      - Interim General Manager
      - Portfolio Executive
      - Portfolio CFO
      - Portfolio CTO
      - Portfolio CMO
      - Portfolio CHRO
      - Part-time Executive
      - Part Time Executive
      - Part-time Director
      - Part Time Director
      - Virtual CFO
      - Virtual CTO
      - Virtual CIO
      - Virtual CMO
    search_patterns:
      - '"fractional" AND role-family term'
      - '"interim" AND executive/director/head/chief term'
      - '"portfolio" AND executive/chief term'
      - '"part-time" AND executive/director/chief term'
      - '"virtual" AND CFO/CTO/CIO/CMO term'
    notes:
      - Fractional roles are first-class opportunities, not temporary noise.
      - Do not reject fractional roles solely because they are part-time or portfolio-based.

  TIER_2_DIRECTOR_HEAD:
    label: Director / Head / senior functional leadership
    search_priority: very_high
    terms:
