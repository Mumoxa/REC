version: 2.0.0
authority: user_supplied
purpose: Default cross-channel priority and independent-run configuration.
market: South Africa

core_principle: >
  Talent Tree has four sourcing channels. They share one search structure, role taxonomy,
  seniority ontology, geography ontology, qualification system and evidence standard.
  Each channel is independently runnable.

channels:
  AGREED_CLIENTS:
    default_priority: 1
    runtime: runtime/agreed-client-worker.md
    canonical_facade: channels/agreed-clients.md
  AGENCY_SITES:
    default_priority: 2
    runtime: runtime/agency-worker.md
    canonical_facade: channels/agency-sites.md
  LINKEDIN:
    default_priority: 3
    runtime: runtime/linkedin-worker.md
    canonical_facade: channels/linkedin.md
  JOB_BOARDS:
    default_priority: 4
    runtime: runtime/jobboard-worker.md
    canonical_facade: channels/job-boards.md

execution:
  independent_channel_runs: true
  channel_requires_prior_channel_completion: false
  default_combined_run_order:
    - AGREED_CLIENTS
    - AGENCY_SITES
    - LINKEDIN
    - JOB_BOARDS
  combined_order_is_default_priority_not_gate: true
  equal_commercial_weight: false
  rule: >
    If one channel is requested, run that channel directly. If a multi-channel/full-market run
    is requested, use the default priority order unless the run instruction explicitly selects
    a different subset/order.

shared_search_authority:
  - core/search-structure.md
  - query_templates.yaml
  - taxonomy/role_taxonomy.json
  - taxonomy/role_taxonomy_rules.yaml
  - taxonomy/seniority_terms.yaml
  - taxonomy/south_africa_locations.yaml
  - core/ideal-client-profile.md
  - core/disqualifiers.md
  - core/scoring-rubric.md
  - core/output-template.md
  - core/qualification.md
  - core/evidence-standard.md
  - core/deduplication.md
  - core/employer-attribution.md
  - sources/agreed-clients.yaml
  - sources/source-governance.md

channel_rules:

  AGREED_CLIENTS:
    objective: Search the full current agreed-client universe across applicable hiring surfaces.
    client_universe: sources/agreed-clients.yaml
    coverage_rule: >
      Every current agreed client must have explicit coverage outcomes for all applicable client
      hiring surfaces during an agreed-client channel run.
    commercial_treatment: IMMEDIATE_PRIORITY
    role_taxonomy: SHARED
    seniority: SHARED
    geography: SHARED
    query_structure: SHARED
    qualification: SHARED_WITH_AGREED_CLIENT_EXCEPTION

  AGENCY_SITES:
    objective: >
      Review the complete relevant current inventory of PRN Recruitment, Communicate Recruitment
      and Network Recruitment and identify end employers where proportionate.
    mandatory_sources:
      - PRN Recruitment
      - Communicate Recruitment
      - Network Recruitment
    role_taxonomy: SHARED
    seniority: SHARED
    geography: SHARED
    query_structure: SHARED
    qualification: SHARED
    attribution_effort:
      board_executive_director_cfo_head_senior_leadership: AGGRESSIVE_MULTI_ANGLE
      senior_lead_specialist_consultant_scarce_skill: MEANINGFUL
      lower_priority: PROPORTIONATE_STOP_IF_UNRESOLVED

  LINKEDIN:
    objective: >
      Discover South African hiring signals across LinkedIn posts, jobs, people/activity,
      company pages, reposts, comments, referrals, visual posts and external X-ray.
    controlling_spec: channels/linkedin/South_Africa_LinkedIn_Hidden_Hiring_Signal_Engine_MASTER.md
    role_taxonomy: SHARED
    seniority: SHARED
    geography: SHARED
    query_structure: SHARED
    qualification: SHARED_DOWNSTREAM
    social_signal_rule: >
      Role-agnostic social signals may be retained when a specific title is not yet recoverable.
      When a role can be identified, use the same shared role taxonomy and seniority ontology as
      every other channel.

  JOB_BOARDS:
    objective: >
      Search the governed job-board, ATS, direct-careers and broader secondary source universe.
    internal_source_order:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      - LONG_TAIL
    role_taxonomy: SHARED
    seniority: SHARED
    geography: SHARED
    query_structure: SHARED
    qualification: SHARED

client_status:
  permanent_field: true
  allowed_values:
    AGREED_CLIENT:
      meaning: Current Talent Tree agreement.
      treatment: IMMEDIATE_PRIORITY
    AGREED_GROUP_ENTITY:
      meaning: Entity falls under confirmed group agreement scope.
      treatment: IMMEDIATE_PRIORITY
    PAST_CLIENT:
      meaning: Previous work exists but current agreement is unverified.
      treatment: VERIFY_BEFORE_TREATING_AS_CURRENT
    TARGET_PROSPECT:
      meaning: No agreement established.
      treatment: NORMAL_COMMERCIAL_QUALIFICATION
    UNKNOWN:
      meaning: Employer not established.
      treatment: EMPLOYER_ATTRIBUTION_REQUIRED

cross_channel_rules:
  - EACH_CHANNEL_CAN_RUN_WITHOUT_PRIOR_CHANNEL_COMPLETION
  - ALL_CHANNELS_USE_IDENTICAL_SHARED_SEARCH_AUTHORITIES
  - CLIENT_STATUS_SURVIVES_DEDUPLICATION_AND_ENRICHMENT
  - AGREED_CLIENT_MATCH_FROM_ANY_CHANNEL_RECEIVES_IMMEDIATE_COMMERCIAL_PRIORITY
  - PAST_CLIENT_MUST_NOT_BE_AUTO_PROMOTED_TO_CURRENT_AGREED_CLIENT
  - ORIGINAL_CHANNEL_PROVENANCE_MUST_BE_PRESERVED
  - NO_CHANNEL_SPECIFIC_ROLE_TAXONOMY
  - NO_CHANNEL_SPECIFIC_SENIORITY_ONTOLOGY
  - NO_CHANNEL_SPECIFIC_GEOGRAPHY_ONTOLOGY
  - NO_CHANNEL_SPECIFIC_COMMERCIAL_DEFINITION
