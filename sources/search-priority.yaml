version: 1.0.0
authority: user_supplied
purpose: Mandatory sequential source-priority and stage-gating configuration.
market: South Africa

core_principle: >
  The engine starts from where Talent Tree already has the right to do business,
  then moves outward into agency intelligence, distributed LinkedIn intelligence,
  and broader secondary market discovery.

mandatory_sequence:
  - STAGE_1_AGREED_CLIENTS
  - STAGE_2_STRATEGIC_AGENCIES
  - STAGE_3_LINKEDIN_INTELLIGENCE
  - STAGE_4_BROADER_SECONDARY_SOURCES

sequence_is_strict: true
equal_weight_channels: false
broad_market_may_start_before_stage_1_complete: false
stage_3_may_start_before_stage_2_complete: false
stage_4_may_start_before_stage_3_complete: false

stages:

  STAGE_1_AGREED_CLIENTS:
    priority: 1
    label: Current agreed-client universe
    authority: sources/agreed-clients.yaml
    commercial_treatment: IMMEDIATE_PRIORITY
    employer_accessibility_research_required: false
    objective: >
      Find every meaningful current hiring opportunity across the complete agreed-client
      universe before external-market discovery begins.
    client_channels:
      - corporate_careers_and_ATS
      - parent_company_careers
      - subsidiary_and_divisional_careers
      - company_linkedin_jobs
      - company_linkedin_page_posts
      - HR_and_TA_employee_posts
      - hiring_manager_posts
      - executive_and_functional_leader_posts
      - employee_reposts
      - referral_posts
      - unlinked_we_are_hiring_posts
      - recently_removed_or_duplicate_adverts
      - attributable_external_job_boards
      - attributable_recruitment_agency_adverts
    workflow:
      - CLIENT_UNIVERSE
      - VACANCY_DISCOVERY
      - VERIFY_VACANCY
      - IDENTIFY_HIRING_OWNER
      - DETERMINE_TALENT_TREE_RELATIONSHIP
      - CANDIDATE_MARKET_MAPPING
      - OUTREACH_OR_CLIENT_ACTION
    completion_gate:
      rule: >
        Every current agreed client must have a run-ledger entry for every applicable channel.
        A channel may be SEARCHED, NO_RESULTS, NOT_APPLICABLE or ACCESS_LIMITED, but it may not
        be silently skipped.
      required_client_coverage: ALL_CURRENT_AGREED_CLIENTS
    promotion_rule:
      matched_statuses:
        - AGREED_CLIENT
        - AGREED_GROUP_ENTITY
      action: IMMEDIATE_STAGE_1_PIPELINE

  STAGE_2_STRATEGIC_AGENCIES:
    priority: 2
    label: PRN + Communicate + Network Recruitment
    mandatory_sources:
      - PRN Recruitment
      - Communicate Recruitment
      - Network Recruitment
    inventory_rule: REVIEW_COMPLETE_RELEVANT_CURRENT_INVENTORY
    objective: >
      Find relevant vacancies and establish the actual end employer wherever proportionate.
    workflow:
      - AGENCY_ADVERT
      - EXTRACT_EVIDENCE
      - IDENTIFY_PROBABLE_END_CLIENT
      - VERIFY_EMPLOYER
      - ASSESS_COMMERCIAL_VALUE
      - IDENTIFY_HIRING_STAKEHOLDERS
    attribution_effort:
      executive_director_cfo_head_senior_leadership: AGGRESSIVE_MULTI_ANGLE
      senior_lead_specialist_scarce_skill: MEANINGFUL
      lower_priority: PROPORTIONATE_STOP_IF_UNRESOLVED
    feedback_loop:
      if_end_employer_status:
        - AGREED_CLIENT
        - AGREED_GROUP_ENTITY
      action: PROMOTE_TO_STAGE_1_IMMEDIATELY
    completion_gate:
      rule: >
        Each mandatory agency must have its complete relevant current vacancy inventory reviewed,
        with source completeness and access limitations logged.

  STAGE_3_LINKEDIN_INTELLIGENCE:
    priority: 3
    label: South Africa LinkedIn distributed hiring intelligence
    controlling_spec: channels/linkedin/South_Africa_LinkedIn_Hidden_Hiring_Signal_Engine_MASTER.md
    objective: >
      Discover silent, distributed and socially amplified South African hiring signals after
      Stage 1 and Stage 2 are complete.
    signal_surfaces:
      - individual_recruiter_posts
      - internal_recruiter_posts
      - hiring_manager_posts
      - executive_posts
      - employee_reposts
      - referral_requests
      - team_growth_posts
      - join_our_team_posts
      - looking_for_posts
      - know_anyone_posts
      - please_share_posts
      - vacancy_images
      - vacancy_documents_and_carousels
      - email_application_posts
      - comment_distributed_jobs
      - reposted_vacancies
      - personal_posts_linking_to_ATS
      - hashtag_recruitment
      - company_page_hiring_announcements
    geography_order:
      - P1_WESTERN_CAPE
      - P2_GAUTENG
      - P3_KWAZULU_NATAL
      - P4_SOUTH_AFRICA
    role_agnostic_discovery: true
    qualification_belongs_downstream: true
    feedback_loop:
      if_employer_resolves_to:
        - AGREED_CLIENT
        - AGREED_GROUP_ENTITY
      action: PROMOTE_TO_STAGE_1_IMMEDIATELY
    completion_gate:
      rule: >
        Complete the LinkedIn master's required geographic and social-surface passes or record
        explicit access limitations before Stage 4 begins.

  STAGE_4_BROADER_SECONDARY_SOURCES:
    priority: 4
    label: Broader South African market discovery
    objective: >
      Search the governed 350-source universe and long-tail secondary sources only after the
      first three stages have been completed.
    internal_order:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      - LONG_TAIL
    safeguards:
      - high_volume_public_jobboards_must_not_crowd_out_earlier_stages
      - prefer_direct_employer_or_original_source_over_aggregator_when_equivalent
      - preserve_duplicate_sources_without_double_counting
    feedback_loop:
      if_employer_resolves_to:
        - AGREED_CLIENT
        - AGREED_GROUP_ENTITY
      action: PROMOTE_TO_STAGE_1_IMMEDIATELY

client_status:
  permanent_field: true
  allowed_values:
    AGREED_CLIENT:
      meaning: Current Talent Tree agreement.
      treatment: IMMEDIATE_PRIORITY
    AGREED_GROUP_ENTITY:
      meaning: Entity falls under confirmed group agreement scope.
      treatment: IMMEDIATE_PRIORITY
    PAST_CLIENT:
      meaning: Previous work exists but current agreement is unverified.
      treatment: VERIFY_BEFORE_PRIORITY_1
    TARGET_PROSPECT:
      meaning: No current agreement established.
      treatment: NORMAL_COMMERCIAL_QUALIFICATION
    UNKNOWN:
      meaning: Employer not established.
      treatment: EMPLOYER_ATTRIBUTION_REQUIRED

global_rules:
  - AGREED_CLIENT_VACANCIES_DO_NOT_COMPETE_WITH_GENERAL_MARKET_VACANCIES
  - SOURCE_PRIORITY_IS_MANDATORY_AND_SEQUENTIAL
  - CLIENT_STATUS_MUST_SURVIVE_DEDUPLICATION_AND_ENRICHMENT
  - CLIENT_STATUS_MUST_NOT_BE_INFERRED_FROM_GROUP_NAME_ALONE
  - PAST_CLIENT_MUST_NOT_BE_AUTO_PROMOTED_TO_STAGE_1
  - AGREED_CLIENT_MATCH_FROM_ANY_LATER_STAGE_TRIGGERS_IMMEDIATE_PROMOTION
  - HIGH_VOLUME_PUBLIC_RESULTS_MUST_NOT_STARVE_HIGHER_PRIORITY_STAGES
