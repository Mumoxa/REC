engine:
  name: talent-tree-recruitment-intelligence
  version: 0.13.0
  market: South Africa
  status: infrastructure_v1

principles:
  canonical_repository: true
  preserve_source_provenance: true
  evidence_first: true
  do_not_invent_missing_facts: true
  discovery_and_qualification_are_separate: true
  four_channels_only: true
  channels_independently_runnable: true
  shared_search_structure_is_mandatory: true
  search_structure_authority: core/search-structure.md
  location_authority: taxonomy/south_africa_locations.yaml
  role_taxonomy_authority: taxonomy/role_taxonomy.json
  role_taxonomy_rules: taxonomy/role_taxonomy_rules.yaml
  seniority_authority: taxonomy/seniority_terms.yaml
  query_templates_authority: query_templates.yaml
  query_output_schema: schemas/generated-query.schema.json
  source_priority_authority: sources/search-priority.yaml
  client_universe_authority: sources/agreed-clients.yaml
  client_sweep_schema: schemas/client-sweep.schema.json
  stakeholder_contact_authority: core/stakeholder-contact-intelligence.md
  candidate_market_mapping_authority: core/candidate-market-mapping.md
  independent_qa_authority: core/independent-qa.md
  candidate_query_templates_authority: candidate_query_templates.yaml
  candidate_market_map_schema: schemas/candidate-market-map.schema.json
  qa_review_schema: schemas/qa-review.schema.json
  workspace_interface_authority: interface/README.md
  vacancy_workspace_authority: interface/vacancy-intelligence-workspace.md
  workspace_search_filter_authority: interface/search-filter-contract.md
  workspace_record_binding_authority: interface/record-binding-contract.md
  workspace_design_authority: interface/design-system.md
  workspace_prototype_authority: interface/prototype/README.md
  workspace_view_state_schema: schemas/workspace-view-state.schema.json
  workspace_saved_view_schema: schemas/workspace-saved-view.schema.json
  workspace_operational_state_schema: schemas/workspace-operational-state.schema.json
  fifty_candidate_target_is_not_quota: true
  run_complete_requires_client_submittable_candidates: true
  published_requires_persistence_verification: true

architecture:
  guard: ARCHITECTURE_GUARD.md
  canonical_model: core_plus_four_channels_plus_optional_runs
  channel_count_invariant: 4
  allowed_sourcing_channels:
    - AGREED_CLIENTS
    - AGENCY_SITES
    - LINKEDIN
    - JOB_BOARDS
  canonical_core_facade:
    - core/ideal-client-profile.md
    - core/disqualifiers.md
    - core/scoring-rubric.md
    - core/output-template.md
    - core/search-structure.md
  canonical_channel_facade:
    AGREED_CLIENTS: channels/agreed-clients.md
    AGENCY_SITES: channels/agency-sites.md
    LINKEDIN: channels/linkedin.md
    JOB_BOARDS: channels/job-boards.md
  optional_runs_directory: runs/
  support_layers_not_channels:
    - runtime
    - schemas
    - taxonomy
    - sources
    - tests
    - archive
    - query_templates
    - enrichment
    - employer_attribution
    - stakeholder_intelligence
    - candidate_market_mapping
    - independent_qa
    - candidate_query_templates
    - interface
    - workspace_presentation
    - workspace_operational_state
  new_channel_requires_explicit_architecture_change: true

execution:
  runner: runtime/orchestrator.md
  independent_channel_runs: true
  prior_channel_completion_required: false
  default_combined_run_order:
    - AGREED_CLIENTS
    - AGENCY_SITES
    - LINKEDIN
    - JOB_BOARDS
  default_order_is_priority_not_gate: true
  downstream_enrichment:
    worker: enrichment
    may_process_any_channel_output: true
  downstream_candidate_mapping:
    worker: candidate_mapping
    may_process_any_channel_output: true
    requires_prior_other_channel_completion: false
    credible_longlist_target: 50
    target_is_quota: false
    run_completion_requires_client_submittable_candidate: true
  presentation:
    primary_interface: VACANCIES_INBOX
    interface_type: browser_workspace
    source_of_truth: structured_records
    exports:
      - EXCEL
      - CSV
      - PDF
    html_snapshot_allowed: true
    per_run_html_is_source_of_truth: false
    authorities:
      - interface/README.md
      - interface/vacancy-intelligence-workspace.md
      - interface/search-filter-contract.md
      - interface/record-binding-contract.md
      - interface/design-system.md
      - interface/prototype/README.md
      - schemas/workspace-view-state.schema.json
      - schemas/workspace-saved-view.schema.json
      - schemas/workspace-operational-state.schema.json
  run_completion:
    channel_coverage_is_not_run_completion: true
    every_qualifying_opportunity_requires_candidate_map_ready: true
    every_qualifying_opportunity_requires_client_submittable_candidate: true
    client_submittable_market_bucket: TOP_10
    allowed_candidate_qa:
      - PASS
      - PASS_WITH_UNKNOWNS
    zero_submit_ready_candidates_forbids_complete: true
    publish_requires_canonical_datastore_persistence: true
    publish_requires_post_write_verification: true
  mandatory_qa_gates:
    - A_DISCOVERY
    - B_FINGERPRINT
    - C_TARGET_COMPANY
    - D_CANDIDATE

shared_channel_stack:
  - core/search-structure.md
  - query_templates.yaml
  - taxonomy/role_taxonomy.json
  - taxonomy/role_taxonomy_rules.yaml
  - taxonomy/seniority_terms.yaml
  - taxonomy/south_africa_locations.yaml
  - core/ideal-client-profile.md
  - core/disqualifiers.md
  - core/scoring-rubric.md
  - core/output-template.md
  - core/qualification.md
  - core/evidence-standard.md
  - core/deduplication.md
  - core/employer-attribution.md
  - core/stakeholder-contact-intelligence.md
  - core/independent-qa.md
  - sources/agreed-clients.yaml
  - sources/search-priority.yaml
  - sources/source-governance.md

workers:
  agreed_clients:
    channel: AGREED_CLIENTS
    independently_runnable: true
    inherit: shared_channel_stack
    purpose: current_agreed_client_universe_search
    channel_specific_load:
      - channels/agreed-clients.md
      - schemas/client-sweep.schema.json
      - schemas/discovered-job.schema.json
    runtime: runtime/agreed-client-worker.md
    output_schema: schemas/discovered-job.schema.json

  agencies:
    channel: AGENCY_SITES
    independently_runnable: true
    inherit: shared_channel_stack
    purpose: strategic_agency_inventory_and_employer_attribution
    channel_specific_load:
      - channels/agency-sites.md
      - channels/agencies/strategy.md
      - schemas/discovered-job.schema.json
    runtime: runtime/agency-worker.md
    output_schema: schemas/discovered-job.schema.json

  linkedin:
    channel: LINKEDIN
    independently_runnable: true
    inherit: shared_channel_stack
    purpose: south_africa_social_hiring_intelligence
    authoritative_spec:
      - channels/linkedin/South_Africa_LinkedIn_Hidden_Hiring_Signal_Engine_MASTER.md
    channel_specific_load:
      - channels/linkedin.md
      - channels/linkedin/strategy.md
      - schemas/linkedin-signal.schema.json
    runtime: runtime/linkedin-worker.md
    output_schema: schemas/linkedin-signal.schema.json
    discovery_note: >
      LinkedIn uses the same role taxonomy and seniority ontology for search expansion and
      classification. It may retain a role-agnostic social signal when the exact role is not yet
      recoverable; this is a recall rule, not a separate taxonomy.

  jobboards:
    channel: JOB_BOARDS
    independently_runnable: true
    inherit: shared_channel_stack
    purpose: job_board_ats_and_broader_secondary_discovery
    channel_specific_load:
      - channels/job-boards.md
      - channels/jobboards/strategy.md
      - schemas/discovered-job.schema.json
    runtime: runtime/jobboard-worker.md
    output_schema: schemas/discovered-job.schema.json

  enrichment:
    sourcing_channel: false
    purpose: shared_post_discovery_normalisation_and_enrichment
    load:
      - core/search-structure.md
      - query_templates.yaml
      - taxonomy/role_taxonomy.json
      - taxonomy/role_taxonomy_rules.yaml
      - taxonomy/seniority_terms.yaml
      - taxonomy/south_africa_locations.yaml
      - core/ideal-client-profile.md
      - core/disqualifiers.md
      - core/scoring-rubric.md
      - core/output-template.md
      - core/qualification.md
      - core/evidence-standard.md
      - core/deduplication.md
      - core/employer-attribution.md
      - core/stakeholder-contact-intelligence.md
      - sources/agreed-clients.yaml
      - sources/search-priority.yaml
      - schemas/linkedin-signal.schema.json
      - schemas/discovered-job.schema.json
      - schemas/final-opportunity.schema.json
    accepted_inputs:
      - schemas/linkedin-signal.schema.json
      - schemas/discovered-job.schema.json
    output_schema: schemas/final-opportunity.schema.json

  qa_review:
    sourcing_channel: false
    purpose: independent_adversarial_evidence_review
    runtime: runtime/qa-review-worker.md
    authority:
      - core/evidence-standard.md
      - core/independent-qa.md
      - schemas/qa-review.schema.json

  candidate_mapping:
    sourcing_channel: false
    purpose: shared_passive_candidate_market_mapping_and_top10
    runtime: runtime/candidate-mapping-worker.md
    may_process_any_channel_output: true
    requires_prior_other_channel_completion: false
    credible_longlist_target: 50
    target_is_quota: false
    load:
      - core/evidence-standard.md
      - core/independent-qa.md
      - core/candidate-market-mapping.md
      - candidate_query_templates.yaml
      - taxonomy/role_taxonomy.json
      - taxonomy/role_taxonomy_rules.yaml
      - taxonomy/seniority_terms.yaml
      - taxonomy/south_africa_locations.yaml
      - schemas/final-opportunity.schema.json
      - schemas/role-environment-fingerprint.schema.json
      - schemas/candidate-market-map.schema.json
      - schemas/qa-review.schema.json
    accepted_inputs:
      - schemas/final-opportunity.schema.json
    output_schema: schemas/candidate-market-map.schema.json

source_documents:
  current_linkedin_master:
    - channels/linkedin/South_Africa_LinkedIn_Hidden_Hiring_Signal_Engine_MASTER.md
  historical_reference:
    - archive/originals/South_Africa_LinkedIn_Hiring_Signal_Engine.md
    - archive/originals/Talent_Tree_Agreed_Clients_and_Vacancy_Source_Map.md
    - archive/originals/BUILD_INSTRUCTION_query_templates.md

tests:
  golden_cases: tests/golden-cases.yaml
  candidate_market_mapping_golden_cases: tests/candidate-market-mapping-golden-cases.yaml
  workspace_ui_golden_cases: tests/workspace-ui-golden-cases.yaml
  run_completion_publishing_golden_cases: tests/run-completion-publishing-golden-cases.yaml


application:
  status: operational_v1
  framework: nextjs_app_router
  root: src/app
  primary_route: /
  primary_interface: VACANCIES_INBOX
  data_adapter: src/lib/data/repository.ts
  demo_data: src/lib/data/demo.ts
  live_store: supabase_postgres
  database_migration: supabase/migrations/001_initial_operational_schema.sql
  auth: supabase_magic_link_ssr
  auth_proxy: proxy.ts
  ingestion_endpoint: /api/ingest/run
  supabase_edge_ingestion: supabase/functions/ingest-run/index.ts
  supabase_edge_ingestion_function: ingest-run
  ingestion_auth: hashed_bearer_token
  vercel_database_admin_secret_required: false
  ingestion_contract: docs/RUN_PUBLISHING.md
  app_operations: docs/APP_OPERATIONS.md
  research_write_boundary: service_or_agent_only
  recruiter_write_boundary:
    - vacancy_operations
    - candidate_operations
    - saved_views
  ci: .github/workflows/app-ci.yml
