engine:
  name: talent-tree-recruitment-intelligence
  version: 0.5.0
  market: South Africa
  status: infrastructure_v1

principles:
  canonical_repository: true
  preserve_source_provenance: true
  evidence_first: true
  do_not_invent_missing_facts: true
  discovery_and_qualification_are_separate: true
  location_authority: taxonomy/south_africa_locations.yaml
  location_search_order_is_mandatory: true
  role_taxonomy_authority: taxonomy/role_taxonomy.json
  role_taxonomy_rules: taxonomy/role_taxonomy_rules.yaml
  seniority_authority: taxonomy/seniority_terms.yaml

workers:
  linkedin:
    purpose: role_agnostic_social_hiring_discovery
    authoritative_spec:
      - channels/linkedin/South_Africa_LinkedIn_Hidden_Hiring_Signal_Engine_MASTER.md
    load:
      - taxonomy/seniority_terms.yaml
      - taxonomy/south_africa_locations.yaml
      - schemas/linkedin-signal.schema.json
    must_not_apply_during_discovery:
      - salary_threshold
      - role_family_exclusions
      - commercial_priority
      - employer_exclusions
      - client_priority
      - outreach_priority
    output_schema: schemas/linkedin-signal.schema.json

  agencies:
    load:
      - taxonomy/role_taxonomy.json
      - taxonomy/role_taxonomy_rules.yaml
      - taxonomy/seniority_terms.yaml
      - taxonomy/south_africa_locations.yaml
      - core/qualification.md
      - core/evidence-standard.md
      - core/employer-attribution.md
      - sources/agreed-clients.yaml
      - sources/source-governance.md
      - channels/agencies/strategy.md
      - schemas/discovered-job.schema.json
    output_schema: schemas/discovered-job.schema.json

  jobboards:
    load:
      - taxonomy/role_taxonomy.json
      - taxonomy/role_taxonomy_rules.yaml
      - taxonomy/south_africa_locations.yaml
      - core/qualification.md
      - core/evidence-standard.md
      - sources/agreed-clients.yaml
      - sources/source-governance.md
      - channels/jobboards/strategy.md
      - schemas/discovered-job.schema.json
    output_schema: schemas/discovered-job.schema.json

  enrichment:
    load:
      - taxonomy/role_taxonomy.json
      - taxonomy/role_taxonomy_rules.yaml
      - taxonomy/south_africa_locations.yaml
      - core/qualification.md
      - core/evidence-standard.md
      - core/deduplication.md
      - core/employer-attribution.md
      - sources/agreed-clients.yaml
      - schemas/linkedin-signal.schema.json
      - schemas/discovered-job.schema.json
      - schemas/final-opportunity.schema.json
    accepted_inputs:
      - schemas/linkedin-signal.schema.json
      - schemas/discovered-job.schema.json
    output_schema: schemas/final-opportunity.schema.json

source_documents:
  current_linkedin_master:
    - channels/linkedin/South_Africa_LinkedIn_Hidden_Hiring_Signal_Engine_MASTER.md
  historical_reference:
    - archive/originals/South_Africa_LinkedIn_Hiring_Signal_Engine.md
    - archive/originals/Talent_Tree_Agreed_Clients_and_Vacancy_Source_Map.md

tests:
  golden_cases: tests/golden-cases.yaml
