version: 0.1.0

cases:
  - id: high_salary_sales_director
    input:
      title: Sales Director
      salary_pa: 1800000
      existing_client: false
    expected:
      functional_scope: EXCLUDE
      deep_employer_research: false
    reason: General-market Sales & Business Development exclusion overrides salary.

  - id: anonymous_head_of_finance
    input:
      title: Head of Finance
      advertiser_type: THIRD_PARTY
      employer_named: false
      location: Cape Town
    expected:
      discard_for_hidden_employer: false
      employer_attribution_required: true
      contradiction_test_required: true
    reason: Senior hidden-employer role warrants deep attribution.

  - id: agency_is_not_employer
    input:
      advertiser: Network Recruitment
      client_named: false
    expected:
      advertiser_type: THIRD_PARTY
      employer_name: null
      employer_status: UNKNOWN
    reason: Recruiter must not be silently treated as the hiring company.

  - id: hypothesis_must_stay_hypothesis
    input:
      employer_candidate: Example Co
      evidence: contextual_only
    expected:
      employer_status_not: CONFIRMED
    reason: Weak/contextual evidence cannot be upgraded to confirmed.

  - id: agreed_client_outside_general_taxonomy
    input:
      existing_client: true
      general_taxonomy_result: EXCLUDE
      meaningful_recruitment_opportunity: true
    expected:
      suppress_signal: false
      route: AGREED_CLIENT_EXCEPTION_REVIEW
    reason: Source map requires meaningful agreed-client intelligence to be retained separately.

  - id: multi_role_linkedin_post
    input:
      source_post_roles:
        - Financial Manager
        - Procurement Manager
        - Data Engineer
    expected:
      source_record_count: 1
      vacancy_record_count: 3
      shared_parent_signal: true
    reason: One source can create multiple vacancy records.

  - id: duplicate_sources_one_job
    input:
      same_role_sources:
        - employer_careers
        - linkedin_post
        - agency_advert
    expected:
      canonical_jobs: 1
      preserve_all_sources: true
    reason: Duplicate adverts must enrich one canonical vacancy, not inflate volume.

  - id: rieses_identity_guard
    input:
      client_name: Rieses Food Imports
      similarly_named_company_match: true
      identity_verified: false
    expected:
      automatic_match: false
    reason: Client source registry marks identity as requiring verification.

  - id: old_mutual_entity_scope
    input:
      client_name: Old Mutual
      employing_business_unit_known: false
    expected:
      agreement_scope_confirmed: false
      outreach_ready: false
    reason: Specific agreement entity/business unit remains unresolved.


  - id: linkedin_discovery_ignores_salary_gate
    input:
      channel: linkedin
      country: South Africa
      genuine_hiring_signal: true
      estimated_salary_pa: 300000
    expected:
      surface_downstream: true
      apply_salary_exclusion_in_linkedin_worker: false
    reason: LinkedIn hidden-hiring master is role-agnostic and commercial filtering happens downstream.

  - id: linkedin_discovery_ignores_role_exclusion
    input:
      channel: linkedin
      country: South Africa
      genuine_hiring_signal: true
      role_family: Sales & Business Development
    expected:
      surface_downstream: true
      apply_role_exclusion_in_linkedin_worker: false
    reason: Discovery coverage must not be narrowed by downstream commercial taxonomy.

  - id: silent_repost_is_first_class_signal
    input:
      source_type: SILENT_REPOST
      original_post_contains_vacancy: true
    expected:
      retain_signal: true
      inspect_reposter_activity: true
      preserve_repost_chain: true
    reason: Silent reposts are both vacancy signals and amplifier-discovery paths.

  - id: reaction_feed_discovery_preserves_network_trigger
    input:
      source_type: REACTION_FEED_DISCOVERY
      underlying_vacancy_valid: true
      surfaced_via_person: Person A
    expected:
      retain_underlying_vacancy: true
      retain_surfacing_person: true
    reason: Feed reactions are second-order hiring-intelligence signals.

  - id: visual_only_post_requires_media_inspection
    input:
      post_text: "We're hiring. See below."
      has_image: true
    expected:
      inspect_media: true
      allow_multiple_opportunities_from_one_signal: true
    reason: Useful job data may exist only in an image, PDF, carousel or document.


  - id: geography_region_priority_order
    input:
      available_regions:
        - Gauteng
        - Western Cape
        - KwaZulu-Natal
        - Eastern Cape
    expected:
      search_order:
        - Western Cape
        - Gauteng
        - KwaZulu-Natal
        - Eastern Cape
    reason: Authoritative South Africa search order is P1 Western Cape, P2 Gauteng, P3 KwaZulu-Natal, then P4 rest of South Africa.

  - id: western_cape_cluster_order
    input:
      region: Western Cape
    expected:
      cluster_order:
        - Cape Town Metro
        - Northern Suburbs / N1
        - Cape Town CBD
        - Stellenbosch / Cape Winelands
        - Century City
        - Industrial Cape Town
        - Southern Suburbs
        - Somerset West / Helderberg
        - George / Garden Route
        - Remaining Western Cape
    reason: Preserve the user-specified Western Cape engine order.

  - id: gauteng_cluster_order
    input:
      region: Gauteng
    expected:
      cluster_order:
        - Sandton / Johannesburg North
        - Midrand / Waterfall
        - Centurion
        - Pretoria
        - Ekurhuleni / East Rand
        - Randburg / Fourways
        - West Rand
        - Remaining Gauteng
    reason: Preserve the user-specified Gauteng engine order.

  - id: kzn_cluster_order
    input:
      region: KwaZulu-Natal
    expected:
      cluster_order:
        - Umhlanga / Durban North
        - Durban
        - Pinetown / Westmead / New Germany
        - Ballito / Dube TradePort
        - Hammarsdale / Cato Ridge
        - South Durban Industrial
        - Pietermaritzburg
        - Richards Bay
        - Remaining KZN
    reason: Preserve the user-specified KZN engine order.

  - id: granular_node_not_flattened
    input:
      raw_location: Epping Industria
    expected:
      region_priority: P1
      cluster_label: Industrial / FMCG / logistics
      node_retained: Epping Industria
      normalize_only_to: Cape Town
    expected_not:
      node_retained: null
    reason: Commercial and industrial nodes must survive normalization rather than being flattened into a metro label.

  - id: national_search_not_complete_geographic_coverage
    input:
      query_location: South Africa
    expected:
      complete_geographic_coverage: false
    reason: Country-level search does not replace granular city, suburb, business-node and industrial-area searches.

  - id: remote_terms_are_p4_catchall
    input:
      raw_location: Remote South Africa
    expected:
      region_priority: P4
      cluster_label: Remote / National / Hybrid
    reason: National and location-independent terms belong to the P4 catch-all after priority regional sweeps.


  - id: taxonomy_credit_risk_included
    input:
      title: Credit Risk Manager
    expected:
      exclusion_status: IN_SCOPE
    reason: Credit Risk is explicitly distinct from excluded cyber-risk work.

  - id: taxonomy_commercial_manager_included
    input:
      title: Commercial Manager
      duties: commercial strategy and margin management
    expected:
      exclusion_status: IN_SCOPE
    reason: Commercial Management is included even though traditional direct sales/business-development roles are excluded.

  - id: taxonomy_crm_boundary
    input:
      examples:
        - Lifecycle Manager
        - CRM Systems Manager
    expected:
      Lifecycle Manager: Commercial CRM
      CRM Systems Manager: CRM Technology
    reason: Commercial CRM and CRM Technology are separate populations.

  - id: taxonomy_business_analyst_boundary
    input:
      title: Business Analyst
      remit: systems requirements integrations digital platform
    expected:
      group_name: Functional IT / Business Systems
    reason: Technology-centred Business Analysis belongs under Functional IT.

  - id: taxonomy_data_boundary
    input:
      examples:
        - Data Pipeline Engineer
        - Analytics Engineer
        - BI Developer
        - Data Scientist
        - ML Engineer
    expected:
      distinct_taxonomy_nodes: true
    reason: Data Engineering, Analytics Engineering, BI, Data Science and ML/AI must not be collapsed into one data bucket.

  - id: taxonomy_specialist_priority
    input:
      title: Principal Data Engineer
      people_management: false
      scarce_skill: true
      above_threshold: true
    expected:
      automatic_downgrade_for_no_people_management: false
    reason: Scarce specialists can outrank conventional managers on commercial value.


  - id: seniority_executive_director_exact_search
    input:
      title: Executive Director
    expected:
      search_as_exact_title: true
      board_or_enterprise_band: true
      do_not_reduce_to_generic_director: true
    reason: Executive Director is a mandatory high-priority search term.

  - id: seniority_board_ned_search
    input:
      title: Independent Non-Executive Director
    expected:
      board_level: true
      search_as_exact_title: true
      suppress_for_no_operational_management: false
    reason: Board appointments are first-class senior opportunities.

  - id: seniority_fractional_cfo
    input:
      title: Fractional CFO
      employment_pattern: part-time
    expected:
      fractional_or_interim: true
      seniority_band: TIER_1B_FRACTIONAL_INTERIM_PORTFOLIO
      downgrade_for_part_time: false
    reason: Fractional executives are deliberately included in seniority searches.

  - id: seniority_principal_consultant
    input:
      title: Principal Consultant
      people_management: false
    expected:
      consulting_track: true
      high_seniority: true
      downgrade_for_no_people_management: false
    reason: Consulting ladders do not map cleanly to corporate manager titles.

  - id: seniority_specialist
    input:
      title: Principal Specialist
      people_management: false
      scarce_skill: true
    expected:
      specialist_track: true
      high_seniority: true
      downgrade_for_no_people_management: false
    reason: Specialist seniority is based on scarcity, technical depth and enterprise impact, not only line management.

  - id: seniority_consultant_not_auto_excluded
    input:
      title: Senior Consultant
      role_family_in_scope: true
    expected:
      exclude_because_title_is_consultant: false
    reason: Consultant and consulting titles are explicit search targets subject to normal role-taxonomy exclusions.

  - id: seniority_board_search_positive_only_on_linkedin
    input:
      channel: linkedin
      title: Board Director
    expected:
      add_positive_search_lane: true
      use_seniority_as_discovery_exclusion: false
    reason: Seniority expands LinkedIn discovery but does not narrow the hidden-hiring engine.


  - id: query_exact_before_broad
    input:
      objective: FIND_NEW_VACANCY
      exact_title: Financial Manager
      location: Stellenbosch
    expected:
      first_pass: EXACT
      broad_exploratory_first: false
    reason: Exact and discriminative searches must precede broad recall queries.

  - id: query_bounded_expansion
    input:
      signal_variants: 20
      role_aliases: 30
      location_variants: 15
      date_variants: 4
    expected:
      blind_cartesian_product: false
      generated_queries_bounded: true
    reason: The query engine must prevent combinatorial explosion.

  - id: query_references_authoritative_vocabularies
    input:
      needs:
        - role terms
        - seniority terms
        - location terms
    expected:
      role_source: taxonomy/role_taxonomy.json
      seniority_source: taxonomy/seniority_terms.yaml
      location_source: taxonomy/south_africa_locations.yaml
      duplicate_parallel_lists: false
    reason: Query configuration references canonical vocabularies rather than maintaining drifting copies.

  - id: query_employer_attribution_support_and_contradiction
    input:
      candidate_employer: Example Manufacturing
      employer_status: HYPOTHESIS
    expected:
      supporting_queries: true
      contradiction_queries: true
    reason: Employer attribution requires active contradiction research as well as supporting evidence.

  - id: query_known_employer_skips_attribution
    input:
      role: Financial Manager
      employer: Confirmed Employer
      location: Stellenbosch
    expected:
      generate:
        - VACANCY_FRESHNESS
        - ATS_DISCOVERY
        - STAKEHOLDER_DISCOVERY
      generate_not:
        - EMPLOYER_ATTRIBUTION
    reason: Query selection must reflect current intelligence state.

  - id: query_anonymous_agency_vacancy
    input:
      role: Financial Manager
      employer: null
      agency: Known Agency
      location: Stellenbosch
      industry: manufacturing
      system: SAP
      qualification: CA(SA)
    expected:
      generate:
        - EMPLOYER_ATTRIBUTION
        - JOB_DUPLICATE_DISCOVERY
        - RECRUITER_CLIENT_HISTORY
        - EMPLOYER_CONTRADICTION
    reason: Anonymous agency roles require fingerprint and hypothesis-testing query families.

  - id: query_failed_memory_prevents_repeat
    input:
      query_hash: abc123
      prior_failure: ZERO_RESULTS
      new_evidence: false
      retry_interval_elapsed: false
    expected:
      rerun_identical_query: false
    reason: Identical failed searches must not be repeated without a new reason.

  - id: query_retry_allowed_on_new_evidence
    input:
      query_hash: abc123
      prior_failure: ZERO_RESULTS
      new_evidence: true
    expected:
      rerun_permitted: true
    reason: New evidence is an explicit retry condition.

  - id: query_source_specific_syntax
    input:
      source: employer_ats
      structured_filters_available: true
    expected:
      prefer_structured_filter: true
      force_external_boolean: false
    reason: Reliable native structured search should be preferred where available.

  - id: query_national_geography_not_complete
    input:
      query_location: South Africa
    expected:
      granular_location_expansion_still_required: true
    reason: National queries do not replace the location ontology's granular commercial-node coverage.

  - id: query_high_value_deeper_fallback
    input:
      seniority_signal: Executive Director
      commercial_value: high
    expected:
      deeper_fallback_chain_allowed: true
      weaker_evidence_threshold: false
    reason: High-value opportunities justify more search effort, not lower evidence standards.

  - id: query_contact_requires_stakeholder_relevance
    input:
      stakeholder_relevance: unresolved
    expected:
      run_contact_discovery: false
    reason: Contact intelligence starts only after a relevant person has been established.

  - id: query_result_count_not_primary_metric
    input:
      query_a:
        results: 500
        qualifying_jobs: 0
      query_b:
        results: 7
        qualifying_jobs: 3
    expected:
      optimise_only_for_result_count: false
      track_commercial_yield: true
    reason: Query performance must consider downstream commercial outcomes, not volume alone.


  - id: source_priority_strict_sequence
    input:
      stage_1_complete: false
      request: start_agency_discovery
    expected:
      allowed: false
    reason: Stage 2 may not begin before the agreed-client sweep is complete.

  - id: source_priority_linkedin_waits_for_agencies
    input:
      stage_1_complete: true
      stage_2_complete: false
      request: start_broad_linkedin_intelligence
    expected:
      allowed: false
    reason: Broader LinkedIn intelligence is Stage 3 and follows the strategic-agency sweep.

  - id: source_priority_jobboards_are_stage_4
    input:
      stage_1_complete: true
      stage_2_complete: true
      stage_3_complete: false
      request: start_broader_jobboard_discovery
    expected:
      allowed: false
    reason: Broader secondary job-board/source-map work may not crowd out the first three stages.

  - id: agreed_client_vacancy_immediate_priority
    input:
      employer: Lightstone
      client_status: AGREED_CLIENT
      discovered_in_stage: STAGE_4_BROADER_SECONDARY_SOURCES
    expected:
      promotion_to_stage_1: true
      commercial_priority: IMMEDIATE
    reason: An agreed-client match from any later source is promoted immediately.

  - id: agreed_group_entity_immediate_priority
    input:
      employer: Capfin
      client_status: AGREED_GROUP_ENTITY
      discovered_in_stage: STAGE_2_STRATEGIC_AGENCIES
    expected:
      promotion_to_stage_1: true
      commercial_priority: IMMEDIATE
    reason: Confirmed Pepkor agreement entities follow the same Stage 1 treatment.

  - id: past_client_not_stage_1
    input:
      employer: NTT Data
      client_status: PAST_CLIENT
      current_agreement_verified: false
    expected:
      promotion_to_stage_1: false
      next_action: VERIFY_CURRENT_AGREEMENT
    reason: Historical work does not prove a current agreement.

  - id: angaza_identity_guard
    input:
      employer_name_match: Angaza
      client_status: AGREED_CLIENT
      exact_corporate_identity_verified: false
    expected:
      stage_1_priority_retained: true
      automatic_entity_match_confirmed: false
    reason: Angaza is prioritised as agreed while exact identity remains a verification requirement.

  - id: old_mutual_scope_guard
    input:
      employer: Old Mutual
      client_status: AGREED_CLIENT
      employing_business_unit_scope_verified: false
    expected:
      stage_1_priority_retained: true
      agreement_scope_status: UNRESOLVED
    reason: Current client priority and unresolved entity scope are separate facts.

  - id: client_status_survives_deduplication
    input:
      records:
        - source_stage: STAGE_1_AGREED_CLIENTS
          client_status: AGREED_CLIENT
        - source_stage: STAGE_4_BROADER_SECONDARY_SOURCES
          client_status: UNKNOWN
      same_canonical_vacancy: true
    expected:
      canonical_client_status: AGREED_CLIENT
      erase_confirmed_client_status: false
    reason: Deduplication must not lose the strongest confirmed client relationship.

  - id: agreed_client_channel_coverage
    input:
      client: Pepkor Group
      one_applicable_channel_missing_ledger_status: true
    expected:
      stage_1_client_complete: false
    reason: Every applicable Stage 1 client channel must be searched or explicitly marked with an allowed outcome.

  - id: agency_agreed_client_feedback_loop
    input:
      source: Network Recruitment
      resolved_end_employer: Fairheads Benefit Services
      client_status: AGREED_CLIENT
    expected:
      source_priority_stage_original: STAGE_2_STRATEGIC_AGENCIES
      promotion_to_stage_1: true
    reason: Preserve source provenance while promoting the commercial workflow.
