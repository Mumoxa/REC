version: "1.0.0"
purpose: Regression protection for the Recruitment Intelligence Workspace.

cases:
  - id: ui_is_not_fifth_channel
    given: Workspace displays jobs from all four sourcing channels.
    expect:
      - presentation_layer_only
      - channel_count_remains_4

  - id: canonical_vacancy_multiple_sources
    given: Same vacancy appears on employer ATS, LinkedIn and a job board.
    expect:
      - one_canonical_vacancy
      - preserve_all_source_records
      - show_source_lineage
    forbid:
      - duplicate_vacancy_cards_per_source

  - id: selecting_job_scopes_candidates
    given: User selects vacancy A.
    expect:
      - middle_pane_shows_vacancy_A
      - right_pane_shows_candidates_mapped_to_vacancy_A
      - vacancy_filters_remain_active

  - id: collapse_does_not_close
    given: User changes vacancy card from expanded to minimal.
    expect:
      - lifecycle_state_unchanged
      - vacancy_remains_active

  - id: minimise_does_not_close
    given: User minimises selected-vacancy pane.
    expect:
      - lifecycle_state_unchanged
      - selected_vacancy_context_remains_active

  - id: close_preserves_intelligence
    given: User closes vacancy as Filled.
    expect:
      - remove_from_default_active_inbox
      - retain_sources
      - retain_candidate_map
      - retain_top_10
      - retain_search_log
      - retain_QA_history
      - store_close_reason

  - id: filter_persistence
    given: User applies Western Cape + Finance + Employer Confirmed filters and opens vacancies.
    expect:
      - filters_persist
      - queue_position_preserved_where_feasible
    forbid:
      - implicit_filter_reset

  - id: context_search_is_not_research
    given: User searches CA(SA) SAP in candidate pane.
    expect:
      - filter_existing_mapped_candidates
      - do_not_start_external_research

  - id: research_is_explicit
    given: User wants fresh candidate discovery.
    expect:
      - explicit_run_research_action
      - research_query_logged

  - id: evidence_aware_system_filter
    given: User filters SAP = CONFIRMED.
    expect:
      - candidate_level_confirmed_SAP_only
    forbid:
      - employer_level_hypothesis_as_confirmed

  - id: candidate_status_separate_from_QA
    given: Candidate is TOP_10 but notice period is unresolved.
    expect:
      - operational_status_TOP_10
      - notice_period_UNKNOWN

  - id: candidate_focus_mode
    given: User switches to Candidate Focus.
    expect:
      - candidate_pane_expands
      - selected_job_context_remains_visible
      - lifecycle_state_unchanged

  - id: export_is_snapshot
    given: User exports filtered vacancies to Excel.
    expect:
      - canonical_records_unchanged
      - export_is_snapshot

  - id: closed_job_reappears
    given: Previously closed role is surfaced again with current evidence.
    expect:
      - preserve_historical_closed_record
      - link_current_activity_to_history
      - require_current_evidence
  - id: workspace_record_identity_binding
    given: A final opportunity, role fingerprint, candidate market map, and workspace operational records refer to the same vacancy.
    expect:
      - final_opportunity_canonical_job_id_equals_candidate_map_opportunity_id
      - final_opportunity_canonical_job_id_equals_workspace_vacancy_id
      - candidate_objects_have_stable_opaque_candidate_id
      - candidate_assignment_uses_candidate_id_not_display_name
    forbid:
      - generate_new_vacancy_id_per_source_appearance
      - derive_candidate_id_from_personal_data

  - id: close_requires_reason_and_timestamp
    given: Recruiter closes a vacancy.
    expect:
      - lifecycle_status_CLOSED
      - non_null_closed_reason
      - closed_at_date_time
      - preserve_source_candidate_map_top10_search_log_and_QA

  - id: close_other_reason_requires_explanation
    given: Recruiter closes a vacancy with closed_reason OTHER.
    expect:
      - closed_reason_detail_is_required
      - whitespace_only_explanation_is_rejected

  - id: exclude_requires_reason
    given: Recruiter excludes a candidate from one vacancy.
    expect:
      - operational_status_EXCLUDED
      - non_empty_excluded_reason
      - whitespace_only_reason_is_rejected
      - candidate_evidence_unchanged
      - other_vacancy_assignments_unchanged

  - id: research_top10_is_not_recruiter_top10
    given: A candidate is in the evidence-reviewed candidate-market-map top_10, but a recruiter has not added the person to their workflow Top 10.
    expect:
      - show_research_top10_recommendation
      - recruiter_operational_status_remains_unchanged
      - no_research_claim_is_overwritten_by_recruiter_action

  - id: recruiter_workflow_actions_do_not_regress_lifecycle
    given: Candidate assignment is at TOP_10, APPROACH, ENGAGED or SUBMITTED.
    expect:
      - show_earmarked_as_complete_at_or_after_EARMARKED
      - show_recruiter_top10_as_complete_at_or_after_TOP_10
      - disable_earlier_actions_after_workflow_progression
      - unmarking_TOP_10_returns_to_EARMARKED

  - id: saved_view_round_trip
    given: Recruiter saves a view with search, filters, sort, date window, density and visible fields.
    expect:
      - saved_view_has_stable_id_name_scope_created_at_updated_at
      - restore_all_saved_view_facets_together
      - restore_saved_active_tab_and_layout_state
      - keep_research_evidence_out_of_saved_view

  - id: no_live_personal_data_in_browser_preview
    given: Recruiter uses the static UI prototype.
    expect:
      - prototype_banner_identifies_synthetic_sample_records
      - prototype_does_not_connect_to_research_provider
      - local_storage_contains_demo_view_and_operational_state_only
